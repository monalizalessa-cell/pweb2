# Serve o build do React. Como é uma SPA com rotas (/produtos/:id),
# qualquer caminho desconhecido cai no index.html e o react-router resolve.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
